# Values for the argo-cd chart. Only what differs from the chart defaults.

configs:
  cm:
    # Argo CD does not report health for Application resources by default, so
    # sync waves between child Applications would not wait for each other.
    # This restores the health check, which makes the app-of-apps waves work:
    # Kyverno is Healthy before the policies are applied.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

    # Exec into pods from the UI stays off.
    exec.enabled: false

# Dex is only needed for SSO through Dex. Off until SSO is configured
# (see "What I would add for production" in the README).
dex:
  enabled: false

# Small footprint for a starter. For production run the HA layout:
# redis-ha, two or more replicas of server and repoServer, and a PDB each.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

notifications:
  enabled: false

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
