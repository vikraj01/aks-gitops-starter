# Namespace labels the CLI uses to evaluate namespaceSelectors.
apiVersion: cli.kyverno.io/v1alpha1
kind: Value
metadata:
  name: values
namespaceSelector:
  - name: team-a
    labels:
      kubernetes.io/metadata.name: team-a
      workload-tier: apps
  - name: kube-system
    labels:
      kubernetes.io/metadata.name: kube-system
