# Test fixtures for `kyverno test policies/tests`. Not synced to the cluster:
# the kyverno-policies Application only reads the top level of policies/.
apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: team-a
  labels:
    app.kubernetes.io/name: compliant
spec:
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: noncompliant
  namespace: team-a
spec:
  hostNetwork: true
  containers:
    - name: app
      image: registry.example.com/app:1.0.0
      securityContext:
        privileged: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noncompliant-deployment
  namespace: team-a
spec:
  selector:
    matchLabels:
      tier: web
  template:
    metadata:
      labels:
        tier: web
    spec:
      containers:
        - name: app
          image: registry.example.com/app:1.0.0
---
apiVersion: v1
kind: Pod
metadata:
  name: system-pod
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: agent
      image: registry.example.com/agent:1.0.0
