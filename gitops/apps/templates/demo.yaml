# Wave 2: a small workload on the dedicated apps pool.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: "{{ .Release.Namespace }}"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: '{{ required "repoURL must be set by the root Application" .Values.repoURL }}'
    targetRevision: "{{ .Values.targetRevision }}"
    path: gitops/workloads/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
